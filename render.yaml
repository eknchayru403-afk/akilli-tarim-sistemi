services:
  - type: web
    name: akilli-tarim-sistemi
    runtime: python
    buildCommand: "chmod +x backend/build.sh && ./backend/build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: akilli-tarim-db
          property: connectionString

databases:
  - name: akilli-tarim-db
    plan: free
